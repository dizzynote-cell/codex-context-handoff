[handoff]
# auto: try the local CodexFeishuBridge, then command/http if configured, otherwise manual.
adapter = "auto" # auto | manual | bridge | http | command

[bridge]
url = "http://127.0.0.1:8765/api/local-tasks"
timeout_seconds = 12

